[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doppel"
version = "0.1.0"
description = "Doppel - Your Personal AI Work Twin"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Doppel contributors" }]
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "psutil>=5.9",
    "pywin32>=306; platform_system == 'Windows'",
    "watchdog>=4.0",
]

[project.scripts]
doppel = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

